name: Build tvOS IPA

on:
  push:
    branches: [Integration]
  pull_request:
    branches: [Integration]
  workflow_dispatch:

jobs:
  build-tvos:
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Build (tvOS)
        shell: bash
        run: |
          set -euo pipefail

          DERIVED_DATA="${RUNNER_TEMP}/DerivedData"
          LOG_PATH="${RUNNER_TEMP}/xcodebuild.log"

          xcodebuild \
            -project Moonlight.xcodeproj \
            -scheme "Moonlight TV" \
            -configuration Release \
            -sdk appletvos \
            -destination "generic/platform=tvOS" \
            -derivedDataPath "${DERIVED_DATA}" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build | tee "${LOG_PATH}"

          APP_PATH="$(find "${DERIVED_DATA}/Build/Products" -maxdepth 2 -type d -name "*.app" | head -n 1)"
          if [[ -z "${APP_PATH}" ]]; then
            echo "Failed to locate built .app under ${DERIVED_DATA}/Build/Products"
            exit 1
          fi

          mkdir -p "${RUNNER_TEMP}/ipa/Payload"
          cp -R "${APP_PATH}" "${RUNNER_TEMP}/ipa/Payload/"

          (cd "${RUNNER_TEMP}/ipa" && zip -qry "${GITHUB_WORKSPACE}/VoidLink-tvOS.ipa" Payload)

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: VoidLink-tvOS.ipa
          path: VoidLink-tvOS.ipa

      - name: Upload Build Log
        uses: actions/upload-artifact@v4
        with:
          name: xcodebuild.log
          path: ${{ runner.temp }}/xcodebuild.log
